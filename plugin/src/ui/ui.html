<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<link rel="stylesheet" href="./ui.css" />
	</head>
	<body>
		<div class="corner">
			<button id="plan-btn" class="corner-btn" title="План работы" hidden>
				<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
					<path d="M2 3.5l1.2 1.2L5.5 2.4M2 8l1.2 1.2L5.5 6.9M2 12.5l1.2 1.2 2.3-2.3M8 3.6h6M8 8.1h6M8 12.6h6" />
				</svg>
			</button>
			<button id="mcp-btn" class="corner-btn" title="Режим MCP: свернуть плагин в маленький блок — внешние агенты смогут читать дизайн">
				<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
					<path d="M12 22v-5M9 8V2M15 8V2M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z" />
				</svg>
			</button>
			<button id="chats-btn" class="corner-btn" title="Чаты">
				<svg width="13" height="13" viewBox="0 0 16 16" fill="none">
					<path
						d="M2.5 3.2c0-.7.6-1.2 1.2-1.2h8.6c.7 0 1.2.5 1.2 1.2v6c0 .7-.5 1.2-1.2 1.2H6.4L3.5 13v-2.6h-.2c-.4 0-.8-.4-.8-.9V3.2z"
						stroke="currentColor"
						stroke-width="1.2"
						stroke-linejoin="round"
					/>
					<path
						d="M5 5.4h6M5 7.6h4"
						stroke="currentColor"
						stroke-width="1.2"
						stroke-linecap="round"
					/>
				</svg>
			</button>
			<button id="versions-btn" class="corner-btn" title="Версии дизайна">
				<svg width="13" height="13" viewBox="0 0 16 16" fill="none">
					<circle
						cx="8"
						cy="8"
						r="6.2"
						stroke="currentColor"
						stroke-width="1.3"
					/>
					<path
						d="M8 4.6V8l2.4 1.6"
						stroke="currentColor"
						stroke-width="1.3"
						stroke-linecap="round"
						stroke-linejoin="round"
					/>
				</svg>
			</button>
			<button id="settings-btn" class="corner-btn" title="Настройки">
				<svg
					width="14"
					height="14"
					viewBox="0 0 24 24"
					fill="none"
					stroke="currentColor"
					stroke-width="1.9"
					stroke-linecap="round"
					stroke-linejoin="round"
				>
					<path
						d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"
					/>
					<circle cx="12" cy="12" r="3" />
				</svg>
			</button>
		</div>
		<div id="mcp-mini" class="mcp-mini" hidden>
			<span id="mcp-dot" class="mcp-dot"></span>
			<span id="mcp-label" class="mcp-label">MCP</span>
			<button id="mcp-expand" class="mcp-expand" title="Развернуть плагин">
				<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2.5h4v4M13.5 2.5l-5 5M6.5 13.5h-4v-4M2.5 13.5l5-5" /></svg>
			</button>
		</div>
		<div id="plan-pop" class="plan-pop" hidden>
			<div class="plan-head"><span>План работы</span><span class="plan-progress"></span></div>
			<ol class="plan-list"></ol>
			<div class="plan-head check-head" hidden><span>Требования</span><span class="check-progress"></span></div>
			<ol class="plan-list check-list" hidden></ol>
		</div>
		<div id="messages"></div>
		<div class="composer" id="composer">
			<span id="sel" class="ctx-chip" hidden>
				<svg width="10" height="10" viewBox="0 0 12 12" fill="none">
					<path
						d="M1.5 1.5h9v9h-9zM4.5 4.5h3v3h-3z"
						stroke="currentColor"
						stroke-width="1.2"
						stroke-linejoin="round"
					/>
				</svg>
				<span id="sel-label">выделено в Figma</span>
				<button id="sel-clear" title="Не передавать выделение">
					×
				</button>
			</span>
			<div id="attachments" class="attachments" hidden></div>
			<textarea
				id="prompt"
				rows="2"
				placeholder="Опишите дизайн или уточнение…"
			></textarea>
			<div class="composer-bar">
				<div class="bar-left">
					<div class="model-dd" id="model-dd">
						<button id="model-btn" class="pill" disabled>
							<span class="label">Подключение…</span>
							<svg
								width="8"
								height="8"
								viewBox="0 0 10 10"
								fill="none"
							>
								<path
									d="M2 3.5L5 6.5L8 3.5"
									stroke="currentColor"
									stroke-width="1.5"
									stroke-linecap="round"
									stroke-linejoin="round"
								/>
							</svg>
						</button>
						<div class="dd-list" id="dd-list" hidden></div>
					</div>
					<button
						id="attach"
						class="icon-btn"
						title="Прикрепить изображение или документ (PDF, DOCX, txt…) — можно вставить или перетащить"
					>
						<svg
							width="13"
							height="13"
							viewBox="0 0 16 16"
							fill="none"
						>
							<path
								d="M13.5 7.5l-5.6 5.6a3.2 3.2 0 01-4.5-4.5l6-6a2.1 2.1 0 013 3l-6 6a1.1 1.1 0 01-1.5-1.5l5.4-5.4"
								stroke="currentColor"
								stroke-width="1.3"
								stroke-linecap="round"
								stroke-linejoin="round"
							/>
						</svg>
					</button>
					<input
						id="file"
						type="file"
						accept="image/*,.pdf,.docx,.doc,.txt,.md,.csv,.json,.html,.xml,.yaml,.yml,.rtf,.svg"
						multiple
						hidden
					/>
					<button
						id="clear"
						class="icon-btn"
						title="Очистить чат"
						hidden
					>
						<svg
							width="12"
							height="12"
							viewBox="0 0 14 14"
							fill="none"
						>
							<path
								d="M2 3.5h10M5.5 3V2.2c0-.5.4-.9.9-.9h1.2c.5 0 .9.4.9.9V3M3.5 3.5l.5 7.6c0 .6.5 1.1 1.1 1.1h3.8c.6 0 1.1-.5 1.1-1.1l.5-7.6M5.8 6v3.5M8.2 6v3.5"
								stroke="currentColor"
								stroke-width="1.2"
								stroke-linecap="round"
								stroke-linejoin="round"
							/>
						</svg>
					</button>
					<button id="audit-btn" class="icon-btn tool-btn" type="button" title="Аудит выделенного: замечания аннотациями, макет не меняется" hidden><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="4.2"/><path d="M5.2 7l1.4 1.4 2.4-2.8M10.2 10.2L14 14"/></svg></button>
					<button id="style-btn" class="icon-btn tool-btn" type="button" title="Применить стиль первой выделенной ноды к остальным" hidden><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 2.5c-3 1.2-5.2 3.2-6.4 5.4l1.5 1.5c2.2-1.2 4.2-3.4 4.9-6.9zM6.6 8.4C4.6 8.4 4 10 3.6 11.4c-.2.8-.8 1.4-1.6 1.6 2.6.9 5.6.3 5.8-2.6"/></svg></button>
					<button id="swap-btn" class="icon-btn tool-btn" type="button" title="Поменять источник стиля" hidden><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5.5h9.5M10 3l2.5 2.5L10 8M13 10.5H3.5M6 8l-2.5 2.5L6 13"/></svg></button>
					<button id="annotate-btn" class="icon-btn tool-btn" type="button" title="Пометки: обвести или указать стрелкой места на скриншоте выделенного фрейма" hidden><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 13.5l.6-2.9L10.9 2.8a1.3 1.3 0 011.8 0l.5.5a1.3 1.3 0 010 1.8L5.4 12.9l-2.9.6zM9.6 4.1l2.3 2.3"/></svg></button>
				</div>
				<button id="send" class="send-btn" title="Отправить" disabled>
					<svg width="13" height="13" viewBox="0 0 16 16" fill="none">
						<path
							d="M8 13V3M8 3L3.5 7.5M8 3l4.5 4.5"
							stroke="currentColor"
							stroke-width="1.8"
							stroke-linecap="round"
							stroke-linejoin="round"
						/>
					</svg>
				</button>
				<button
					id="cancel"
					class="send-btn stop"
					title="Остановить"
					hidden
				>
					<svg
						width="11"
						height="11"
						viewBox="0 0 12 12"
						fill="currentColor"
					>
						<rect x="1.5" y="1.5" width="9" height="9" rx="1.5" />
					</svg>
				</button>
			</div>
		</div>
		<div id="chats" class="versions" hidden></div>
		<div id="versions" class="versions" hidden></div>
		<div id="settings" class="settings" hidden></div>
		<div id="status">Подключение к мосту…</div>
		<script src="./ui.js"></script>
	</body>
</html>
